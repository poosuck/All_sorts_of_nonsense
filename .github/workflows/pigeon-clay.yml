name: Pigeon clay build
on:
  push:
    branches: [codex/pigeon-clay-v1]
    paths:
      - '.github/workflows/pigeon-clay.yml'
      - 'scripts/pigeon-stage1/**'
      - 'art/pigeon/profiles.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pigeon-clay-build
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/codex/pigeon-clay-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pigeon-clay-v1
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-pil
          blender --version
      - name: Probe model tools
        run: blender -b --factory-startup -t 2 --python-exit-code 1 --python scripts/pigeon-stage1/probe_tools.py
      - name: Build new clay anatomy and eight views
        env:
          PIGEON_EXPORT_BUNDLE: "1"
        run: blender -b --factory-startup -t 2 --python-exit-code 1 --python scripts/pigeon-stage1/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate application
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          npm run source:check
          npx playwright install --with-deps chromium
          node scripts/pigeon-stage1/verify.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pigeon-clay-model
          path: |
            art/pigeon/pigeon.blend
            src/assets/pigeon/
            docs/pigeon/reviews/clay-v1/
          retention-days: 7
